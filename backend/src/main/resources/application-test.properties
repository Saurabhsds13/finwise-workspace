# ============================================
# FinWise - Test Profile
# ============================================
# Uses same PostgreSQL database (test schema or separate test DB)
# DB: finwise_test (localhost:5432)

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finwise_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA - recreate schema for clean test runs
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging
logging.level.com.finwise=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
