# ============================================
# FinWise - Test Profile
# ============================================
# Uses MySQL (localhost:3306/finwise_test)

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:finwise_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA - recreate schema for clean test runs
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging
logging.level.com.finwise=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
